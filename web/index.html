<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle of Fifths</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    background: #fff;
    color: #000;
    font-family: "Latin Modern Roman", "CMU Serif", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #cofs { touch-action: none; user-select: none; -webkit-user-select: none; }
  #cofs svg { width: min(800px, 100%); height: auto; display: block; }
  .hint { font-size: 0.85em; color: #555; margin: 0; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button { font: inherit; padding: 4px 12px; }
  #state { font-size: 0.9em; color: #555; }
</style>
</head>
<body>
<nav>
  <button data-key="+">(+) Step up</button>
  <button data-key="-">(−) Step down</button>
  <button data-key="m">(m) Cycle mode</button>
  <button id="save">Save SVG</button>
</nav>
<div id="state"></div>
<div id="cofs"></div>
<p class="hint">Drag the solfege and steps rings, or click a mode.</p>
<script src="cofs.js"></script>
</body>
</html>
